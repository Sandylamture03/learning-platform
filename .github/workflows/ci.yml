name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    # The API's tests and the app's browser checks run against a real PostgreSQL. The API makes the databases
    # it needs (learning_platform_test, learning_platform_e2e) on this server.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: learning_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # installs the pnpm version in package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check:boundaries
      - run: pnpm exec tsc -p .
      - run: pnpm exec turbo run typecheck test check build
      - run: pnpm validate:html
      - name: W3C (Nu) HTML checker
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/vnu" vnu-jar@26.9.27
          java -jar "$RUNNER_TEMP/vnu/node_modules/vnu-jar/build/dist/vnu.jar" --errors-only --skip-non-html apps/site/dist
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: apps/site/dist

  e2e:
    name: Browser checks (axe, 320px, keyboard)
    runs-on: ubuntu-latest
    # The API's tests and the app's browser checks run against a real PostgreSQL. The API makes the databases
    # it needs (learning_platform_test, learning_platform_e2e) on this server.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: learning_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lp/site exec playwright install --with-deps chromium
      - run: pnpm test:e2e # the site, then the learning app against the API
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/site/playwright-report
            apps/shell/playwright-report
