# PostgreSQL for the API on your machine: `pnpm db:up` starts it, `pnpm db:down` stops it (the data stays in the
# volume). The API's default DATABASE_URL points here.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: learning_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d learning_platform"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
