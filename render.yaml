# Render Blueprint: the platform as one web service (the Dockerfile) and a managed PostgreSQL.
# In Render: New → Blueprint → pick this repository → Apply. The README's "Deploying" section has the steps.
# Pick the region before the first apply: a database cannot move regions afterwards.

databases:
  - name: learning-platform-db
    # free expires 30 days after creation; basic-256mb or larger keeps your data.
    plan: free
    region: oregon
    databaseName: learning_platform
    user: learning_platform
    postgresMajorVersion: "17"
    # No connections from the internet; the web service reaches it over Render's private network.
    ipAllowList: []

services:
  - type: web
    name: learning-platform
    runtime: docker
    # free sleeps after 15 idle minutes and takes about a minute to wake; starter stays up.
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    # Deploy main only after its CI checks pass.
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: learning-platform-db
          property: connectionString
      - key: NODE_ENV
        value: production
      # Render's load balancer is the one proxy in front of the service; rate limits need the learner's address.
      - key: TRUST_PROXY
        value: "1"
